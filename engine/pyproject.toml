[project]
name = "beatmarks-engine"
version = "0.1.0"
description = "BeatMarks audio analysis engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10.2",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.6"]

[project.scripts]
beatmarks-engine = "beatmarks_engine.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beatmarks_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 時間のかかるテスト(既定で実行しない場合は -m 'not slow')"]
